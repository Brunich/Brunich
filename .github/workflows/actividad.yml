name: Gráfica de actividad

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PERFIL_TOKEN deja contar los repos privados; sin él sólo salen los públicos
      - run: python scripts/actividad.py
        env:
          GH_TOKEN: ${{ secrets.PERFIL_TOKEN || github.token }}
      - run: |
          git diff --quiet actividad.svg && exit 0
          git config user.name "Brunich"
          git config user.email "brunich99@gmail.com"
          git commit -am "Actividad al día"
          git push
