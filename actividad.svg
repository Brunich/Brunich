<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <style>
    .t { fill: #1f2328; font-size: 14px; font-weight: 600; }
    .s { fill: #59636e; font-size: 12px; }
    .v { fill: #818b98; }
    .ln { stroke: #d1d9e0; }
    @keyframes trazo { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes aparece { from { opacity: 0; } to { opacity: 1; } }
    @keyframes crece { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes pulso { 0%,100% { r: 4; opacity: 1; } 50% { r: 7; opacity: .35; } }
    .linea { stroke-dasharray: 1; stroke-dashoffset: 0; animation: trazo 2s ease-out both; }
    .area { animation: aparece 1.4s ease-out .8s both; }
    .punto { animation: aparece .3s ease-out 1.9s both, pulso 2.4s ease-in-out 2.2s infinite; }
    .num { animation: aparece .5s ease-out 2s both; }
    .barra { transform-box: fill-box; transform-origin: left; animation: crece 1.4s cubic-bezier(.2,.7,.2,1) both; }
    .leyenda { animation: aparece .6s ease-out 1s both; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    @media (prefers-color-scheme: dark) {
      .t { fill: #f0f6fc; }
      .s { fill: #9198a1; }
      .v { fill: #6e7681; }
      .ln { stroke: #3d444d; }
    }
  </style>
  <defs>
    <linearGradient id="relleno" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb950" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="barra"><rect x="440" y="70" width="360" height="10" rx="5"/></clipPath>
  </defs>

  <text x="20" y="28" class="t">Contribuciones acumuladas</text>
  <text x="20" y="46" class="s">últimos 6 meses · commits, PR, issues y revisiones</text>
  <line x1="24" y1="180" x2="396" y2="180" class="ln"/>
  <path class="area" d="M24.0,174.1 L38.9,173.2 L53.8,171.8 L68.6,171.8 L83.5,166.2 L98.4,166.1 L113.3,165.9 L128.2,165.9 L143.0,165.9 L157.9,165.9 L172.8,165.9 L187.7,157.3 L202.6,156.9 L217.4,156.8 L232.3,155.9 L247.2,153.7 L262.1,149.7 L277.0,146.5 L291.8,143.4 L306.7,139.4 L321.6,136.1 L336.5,133.7 L351.4,130.4 L366.2,128.2 L381.1,124.1 L396.0,70.0 L396,180 L24,180 Z" fill="url(#relleno)"/>
  <path class="linea" pathLength="1" d="M24.0,174.1 L38.9,173.2 L53.8,171.8 L68.6,171.8 L83.5,166.2 L98.4,166.1 L113.3,165.9 L128.2,165.9 L143.0,165.9 L157.9,165.9 L172.8,165.9 L187.7,157.3 L202.6,156.9 L217.4,156.8 L232.3,155.9 L247.2,153.7 L262.1,149.7 L277.0,146.5 L291.8,143.4 L306.7,139.4 L321.6,136.1 L336.5,133.7 L351.4,130.4 L366.2,128.2 L381.1,124.1 L396.0,70.0" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="396.0" cy="70.0" r="4" class="punto" fill="#3fb950"/>
  <text x="388.0" y="74.0" class="s num" text-anchor="end">781</text>
  <g class="s" text-anchor="start"><text x="24.0" y="204">abr</text><text x="83.5" y="204">may</text><text x="157.9" y="204">jun</text><text x="217.4" y="204">jul</text><text x="277.0" y="204">ago</text><text x="351.4" y="204">sep</text></g>

  <text x="440" y="28" class="t">Lenguajes</text>
  <text x="440" y="46" class="s">por volumen de código en mis repos</text>
  <g clip-path="url(#barra)"><g class="barra"><rect x="440.0" y="70" width="268.8" height="10" fill="#58a6ff"/><rect x="708.8" y="70" width="29.7" height="10" fill="#3fb950"/><rect x="738.6" y="70" width="21.8" height="10" fill="#d29922"/><rect x="760.4" y="70" width="15.1" height="10" fill="#bc8cff"/><rect x="775.5" y="70" width="14.2" height="10" fill="#f778ba"/><rect x="789.7" y="70" width="10.3" height="10" fill="#8b949e"/></g></g>
  <g class="leyenda"><circle cx="446" cy="108" r="5" fill="#58a6ff"/><text x="458" y="112" class="s">GDScript <tspan class="v">74,7 %</tspan></text><circle cx="446" cy="138" r="5" fill="#3fb950"/><text x="458" y="142" class="s">Python <tspan class="v">8,3 %</tspan></text><circle cx="446" cy="168" r="5" fill="#d29922"/><text x="458" y="172" class="s">C# <tspan class="v">6,1 %</tspan></text><circle cx="626" cy="108" r="5" fill="#bc8cff"/><text x="638" y="112" class="s">TypeScript <tspan class="v">4,2 %</tspan></text><circle cx="626" cy="138" r="5" fill="#f778ba"/><text x="638" y="142" class="s">GDShader <tspan class="v">3,9 %</tspan></text><circle cx="626" cy="168" r="5" fill="#8b949e"/><text x="638" y="172" class="s">Otros <tspan class="v">2,9 %</tspan></text></g>
</svg>
