<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <style>
    .t { fill: #1f2328; font-size: 14px; font-weight: 600; }
    .s { fill: #59636e; font-size: 12px; }
